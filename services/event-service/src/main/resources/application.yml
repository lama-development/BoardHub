spring:
  application:
    name: event-service
  datasource:
    url: ${BOARDHUB_DB_URL:jdbc:postgresql://localhost:5432/boardhub_db}
    username: ${BOARDHUB_DB_USERNAME:boardhub_user}
    password: ${BOARDHUB_DB_PASSWORD:boardhub_password}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: game_schema
    schemas: game_schema
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
    clean-disabled: true

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info

boardhub:
  characters:
    max-per-participant: ${BOARDHUB_MAX_CHARACTERS_PER_PARTICIPANT:8}
  venue:
    table-claim-ttl: ${BOARDHUB_TABLE_CLAIM_TTL:10m}
    max-claim-minutes: ${BOARDHUB_MAX_CLAIM_MINUTES:60}
    admin-access-key: ${BOARDHUB_VENUE_ADMIN_KEY:boardhub-local-venue-admin-key}
    admin-local-only: ${BOARDHUB_VENUE_ADMIN_LOCAL_ONLY:true}
  join:
    request-ttl: ${BOARDHUB_JOIN_REQUEST_TTL:10m}
    max-players-per-session: ${BOARDHUB_MAX_PLAYERS_PER_SESSION:8}
    max-active-tables: ${BOARDHUB_MAX_ACTIVE_TABLES:8}
    max-requests-per-minute: ${BOARDHUB_MAX_JOIN_REQUESTS_PER_MINUTE:5}
    session-token-secret: ${BOARDHUB_SESSION_TOKEN_SECRET:boardhub-local-session-token-secret}
  mqtt:
    broker-uri: ${BOARDHUB_MQTT_BROKER_URI:tcp://localhost:1883}
    client-id: ${BOARDHUB_MQTT_CLIENT_ID:boardhub-event-service}
    topic: ${BOARDHUB_MQTT_TOPIC:boardhub/v1/venues/venue-01/tables/+/events}
    qos: ${BOARDHUB_MQTT_QOS:1}
