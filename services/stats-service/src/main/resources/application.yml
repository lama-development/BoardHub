spring:
  application:
    name: stats-service
  datasource:
    url: ${BOARDHUB_DB_URL:jdbc:postgresql://localhost:5432/boardhub_db}
    username: ${BOARDHUB_DB_USERNAME:boardhub_user}
    password: ${BOARDHUB_DB_PASSWORD:boardhub_password}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: stats_schema
    schemas: stats_schema
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
    clean-disabled: true

server:
  port: 8083

management:
  endpoints:
    web:
      exposure:
        include: health,info

boardhub:
  stats:
    mqtt:
      broker-uri: ${BOARDHUB_MQTT_BROKER_URI:tcp://localhost:1883}
      client-id: ${BOARDHUB_STATS_MQTT_CLIENT_ID:boardhub-stats-service}
      topic: ${BOARDHUB_STATS_MQTT_TOPIC:boardhub/v1/venues/+/session-results}
      qos: ${BOARDHUB_MQTT_QOS:1}
